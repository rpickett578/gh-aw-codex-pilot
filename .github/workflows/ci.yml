name: Synthetic CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  schedule_route:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      repair: ${{ steps.route.outputs.repair }}
    steps:
      - id: route
        run: echo 'repair=false' >> "$GITHUB_OUTPUT"
  schedule_repair:
    needs: schedule_route
    if: needs.schedule_route.outputs.repair == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'This must be skipped in the clean-review fixture'
  schedule_continue:
    needs: [schedule_route, schedule_repair]
    if: always() && needs.schedule_route.result == 'success' && (needs.schedule_repair.result == 'success' || (needs.schedule_repair.result == 'skipped' && needs.schedule_route.outputs.repair == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'Clean review admitted without repair'
  schedule_next:
    needs: [schedule_route, schedule_continue]
    if: ${{ !cancelled() && needs.schedule_route.result == 'success' && needs.schedule_continue.result == 'success' }}
    uses: ./.github/workflows/phase2-scheduling-worker.yml
    permissions: {}
  scheduling_proof:
    needs: [schedule_route, schedule_repair, schedule_continue, schedule_next]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require real GitHub scheduling and reusable-job output
        env:
          ROUTE: ${{ needs.schedule_route.result }}
          REPAIR: ${{ needs.schedule_repair.result }}
          CONTINUE: ${{ needs.schedule_continue.result }}
          NEXT: ${{ needs.schedule_next.result }}
          PROOF: ${{ needs.schedule_next.outputs.proof }}
        run: |
          test "$ROUTE" = success
          test "$REPAIR" = skipped
          test "$CONTINUE" = success
          test "$NEXT" = success
          test "$PROOF" = fixture-next-executed
  verify:
    name: synthetic-tests
    needs: scheduling_proof
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail required check if real scheduling proof failed or skipped
        env:
          PROOF_RESULT: ${{ needs.scheduling_proof.result }}
        run: test "$PROOF_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Prepare exact official runtime for no-AI native publication contract
        if: github.event.pull_request.base.sha == 'b876867631bc89c7b5775c98c72f1b44a16c963f' && github.event.pull_request.head.ref == 'codex/phase2-publication-contract' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/pilot-gh-aw-native"
          git init "$native"
          git -C "$native" remote add origin https://github.com/github/gh-aw.git
          git -C "$native" sparse-checkout set actions/setup/js actions/setup/md
          git -C "$native" fetch --depth=1 --filter=blob:none origin 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          git -C "$native" checkout --detach FETCH_HEAD
          test "$(git -C "$native" rev-parse HEAD)" = 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          echo "GH_AW_NATIVE_ACTIONS=$native/actions/setup/js" >> "$GITHUB_ENV"
      - name: Validate exact installation or the scoped functional tests
        if: github.event.pull_request.head.ref != 'codex/phase3-resume-and-fail-closed' && github.event.pull_request.head.ref != 'codex/phase4-persistent-queue-foundation' && github.event.pull_request.head.ref != 'codex/phase4-generic-worker-runtime' && github.event.pull_request.head.ref != 'codex/phase4-dispatch-ledger-dryrun' && github.event.pull_request.head.ref != 'codex/phase4-root-worker-gate' && !startsWith(github.event.pull_request.head.ref, 'codex/phase4-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/verify-pilot-ci.py"
          if [ "$BASE_SHA" = b876867631bc89c7b5775c98c72f1b44a16c963f ] && [ "$HEAD_BRANCH" = codex/phase2-publication-contract ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-publication.py" > "$verifier"
          elif [ "$BASE_SHA" = 40ebfd180e4285167d62e9d0ce680b73af5a1116 ] && [ "$HEAD_BRANCH" = codex/phase2-scheduling-v2 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-scheduling.py" > "$verifier"
          elif [ "$BASE_SHA" = fa995cbf91f4e7d02916e35f0fd8f9979a8ad298 ] && [ "$HEAD_BRANCH" = codex/phase2-recovery-v1 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-recovery.py" > "$verifier"
          elif [ "$BASE_SHA" = fe6bf5b4a385da3957b0f5b1678b163510da47cf ] && [ "$HEAD_BRANCH" = codex/phase2-registration-repair ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-registration.py" > "$verifier"
          elif [ "$BASE_SHA" = d5c947f0000a32656eb50a55fca0270e28f6aafa ] && [ "$HEAD_BRANCH" = codex/phase2-issue-3 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-install.py" > "$verifier"
          elif [ "$BASE_SHA" = cdf9d8bb948d36f515e3cb8707e44baab07cd53a ] && [ "$HEAD_BRANCH" = codex/phase3-three-task-pilot ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            git show "$HEAD_SHA:scripts/verify-phase3-install.py" > "$verifier"
          elif [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [[ "$HEAD_BRANCH" == codex/phase3-ascii-vowel-count-v1 || "$HEAD_BRANCH" == codex/phase3-strip-ascii-controls-v1 || "$HEAD_BRANCH" == codex/phase3-collapse-ascii-spaces-v1 ]]; then
            git show "$BASE_SHA:scripts/phase3_worker_ci.py" > "$verifier"
          elif git cat-file -e "$BASE_SHA:scripts/verify-pilot-ci.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          else
            git show "$HEAD_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          fi
          python3 "$verifier"
      - name: Verify Phase 3 resumption, skipped-ancestor continuation and fail-closed completion
        if: github.event.pull_request.head.ref == 'codex/phase3-resume-and-fail-closed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'rpickett578/gh-aw-codex-pilot'
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          python3 -m unittest discover -s test -p 'test_phase3_gate.py' -v
          python3 -m unittest discover -s test -p 'test_phase3_snapshot.py' -v
          python3 -m unittest discover -s test -p 'test_phase3_repair.py' -v
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/phase3-chain.yml .github/workflows/ci.yml
          echo 'PHASE3_RESUME_TESTS_AND_ACTIONLINT_PASS'
      - name: Verify Phase 4 durable queue foundation
        if: github.event.pull_request.head.ref == 'codex/phase4-persistent-queue-foundation'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'rpickett578/gh-aw-codex-pilot'
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$BASE_SHA" = d004619d1e41cee6d140101a7aad254a23615ae6
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import subprocess
          allowed = {'phase4/queue.json', 'scripts/phase4_queue.py',
                     'test/test_phase4_queue.py', '.github/workflows/phase4-queue-status.yml',
                     '.github/workflows/ci.yml', 'docs/phase4-queue.md'}
          names = set(subprocess.check_output(['git','diff','--name-only',
                          'd004619d1e41cee6d140101a7aad254a23615ae6...HEAD'],
                          text=True).splitlines())
          assert names and names <= allowed, f'Unexpected Phase4 scope: {sorted(names - allowed)}'
          print('PHASE4_EXACT_SCOPE_PASS', sorted(names))
          PY
          python3 -m unittest discover -s test -p 'test_phase4_queue.py' -v
          python3 -m py_compile scripts/phase4_queue.py
          git diff --check "$BASE_SHA...$HEAD_SHA"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/phase4-queue-status.yml .github/workflows/ci.yml
          echo PHASE4_QUEUE_TESTS_AND_ACTIONLINT_PASS
      - name: Validate Phase 4 generic worker host guards before gh-aw compilation
        if: github.event.pull_request.head.ref == 'codex/phase4-generic-worker-runtime'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'rpickett578/gh-aw-codex-pilot'
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          python3 -m unittest discover -s test -p 'test_phase4_queue.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_runtime.py' -v
          python3 -m py_compile scripts/phase4_runtime.py
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/phase4-compile.yml .github/workflows/ci.yml
          echo PHASE4_GENERIC_RUNTIME_UNIT_TESTS_PASS
      - name: Verify Phase 4C dispatch preview, immutable scope and ledger tests
        if: github.event.pull_request.head.ref == 'codex/phase4-dispatch-ledger-dryrun'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'rpickett578/gh-aw-codex-pilot'
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'scripts/phase4_dispatch.py', 'test/test_phase4_dispatch.py',
                     'docs/phase4-dispatch-ledger.md',
                     '.github/workflows/phase4-dispatch-ci.yml',
                     '.github/workflows/phase4-dispatch-preview.yml',
                     '.github/workflows/ci.yml'}
          names = set(subprocess.check_output(['git', 'diff', '--name-only',
                         os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA']],
                         text=True).splitlines())
          assert names and names <= allowed, f'Unexpected Phase4C scope: {sorted(names - allowed)}'
          print('PHASE4C_EXACT_SCOPE_PASS', sorted(names))
          PY
          python3 -m unittest discover -s test -p 'test_phase4_dispatch.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_runtime.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_queue.py' -v
          python3 -m py_compile scripts/phase4_dispatch.py
          git diff --check "$BASE_SHA...$HEAD_SHA"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/phase4-dispatch-preview.yml .github/workflows/phase4-dispatch-ci.yml .github/workflows/ci.yml
          echo PHASE4C_TESTS_AND_ACTIONLINT_PASS
      - name: Verify disabled Phase 4D scheduled root and exact engineering scope
        if: github.event.pull_request.head.ref == 'codex/phase4-root-worker-gate'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'.github/workflows/phase4-chain.yml',
                     '.github/workflows/phase4-root-ci.yml',
                     '.github/workflows/ci.yml', 'scripts/phase4_dispatch.py',
                     'scripts/phase4_queue.py', 'test/test_phase4_queue.py',
                     'test/test_phase4_root.py'}
          names = set(subprocess.check_output(['git', 'diff', '--name-only',
                        os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA']],
                        text=True).splitlines())
          assert names and names <= allowed, f'Unexpected Phase4D paths: {sorted(names - allowed)}'
          print('PHASE4D_SCOPE_PASS', sorted(names))
          PY
          python3 -m unittest discover -s test -p 'test_phase4_root.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_dispatch.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_queue.py' -v
          git diff --check "$BASE_SHA...$HEAD_SHA"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/phase4-chain.yml .github/workflows/phase4-root-ci.yml .github/workflows/ci.yml
          echo PHASE4D_TESTS_AND_ACTIONLINT_PASS
      - name: Verify approved one-source Phase4 worker PR with trusted main fixture
        if: >-
          startsWith(github.event.pull_request.head.ref, 'codex/phase4-') &&
          github.event.pull_request.head.ref != 'codex/phase4-persistent-queue-foundation' &&
          github.event.pull_request.head.ref != 'codex/phase4-generic-worker-runtime' &&
          github.event.pull_request.head.ref != 'codex/phase4-dispatch-ledger-dryrun' &&
          github.event.pull_request.head.ref != 'codex/phase4-root-worker-gate' &&
          github.event.pull_request.head.ref != 'codex/phase4-source-ci-foundation'
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase4_trusted"
          for script in phase4_source_ci.py phase4_queue.py; do
            git show "$BASE_SHA:scripts/$script" > "$RUNNER_TEMP/phase4_trusted/$script"
          done
          PYTHONPATH="$RUNNER_TEMP/phase4_trusted" python3 "$RUNNER_TEMP/phase4_trusted/phase4_source_ci.py"
      - name: Verify Phase4 immutable generic source CI foundation
        if: github.event.pull_request.head.ref == 'codex/phase4-source-ci-foundation'
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'rpickett578/gh-aw-codex-pilot'
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'scripts/phase4_source_ci.py', 'test/test_phase4_source_ci.py',
                     'scripts/phase4_queue.py', 'test/test_phase4_queue.py',
                     'test/count-ascii-digits-v1.test.mjs',
                     'test/count-ascii-digits-v1.test-meta.json', '.github/workflows/ci.yml'}
          names = set(subprocess.check_output(['git','diff','--name-only',
                          os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA']],
                          text=True).splitlines())
          assert names and names <= allowed, f'Unexpected source CI foundation scope: {sorted(names - allowed)}'
          print('PHASE4_SOURCE_CI_FOUNDATION_SCOPE_PASS', sorted(names))
          PY
          python3 -m unittest discover -s test -p 'test_phase4_source_ci.py' -v
          python3 -m unittest discover -s test -p 'test_phase4_queue.py' -v
          python3 -m py_compile scripts/phase4_source_ci.py
          git diff --check "$BASE_SHA...$HEAD_SHA"
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml
          echo PHASE4_SOURCE_CI_FOUNDATION_PASS
      - name: Compile the three inert Phase 3 gh-aw sources with pinned official v1.0.1
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v1.0.1
          for id in phase3-coder-1 phase3-coder-2 phase3-coder-3 phase3-review phase3-repair-1 phase3-repair-2 phase3-repair-3; do
            gh aw compile "$id" --strict
            test -s ".github/workflows/$id.lock.yml"
            echo "PHASE3_COMPILE_PASS $id"
          done
          sha256sum .github/workflows/phase3-coder-*.lock.yml .github/workflows/phase3-review.lock.yml .github/workflows/phase3-repair-*.lock.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: phase3-compiled-workers-review-only
          path: |
            .github/workflows/phase3-coder-*.lock.yml
            .github/workflows/phase3-review.lock.yml
            .github/workflows/phase3-repair-*.lock.yml
          if-no-files-found: error
          retention-days: 7
      - name: Export compiled locks as checksummed read-only review evidence
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          for idx in (4, 5, 6, 7):
              name = 'phase3-review' if idx == 4 else f'phase3-repair-{idx-4}'
              path = Path(f'.github/workflows/{name}.lock.yml')
              payload = path.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              serialized = json.dumps(payload.decode('utf-8'), ensure_ascii=True)
              chunks = [serialized[i:i+2048] for i in range(0, len(serialized), 2048)]
              print(f'PHASE3_LOCK_INFO:{idx}:{digest}:{len(payload)}:{len(chunks)}')
              for part, chunk in enumerate(chunks):
                  print(f'PHASE3_LOCK_CHUNK:{idx}:{part}:{len(chunks)}:{chunk}')
          PY
      - name: Lint finite root chain and read-only preflight with pinned actionlint
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.7.7 -R rhysd/actionlint -p actionlint_1.7.7_linux_amd64.tar.gz -p actionlint_1.7.7_checksums.txt -D "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
            tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          )
          "$RUNNER_TEMP/actionlint" -color .github/workflows/phase3-chain.yml .github/workflows/phase3-preflight.yml

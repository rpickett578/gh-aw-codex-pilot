name: Synthetic CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  schedule_route:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      repair: ${{ steps.route.outputs.repair }}
    steps:
      - id: route
        run: echo 'repair=false' >> "$GITHUB_OUTPUT"
  schedule_repair:
    needs: schedule_route
    if: needs.schedule_route.outputs.repair == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'This must be skipped in the clean-review fixture'
  schedule_continue:
    needs: [schedule_route, schedule_repair]
    if: always() && needs.schedule_route.result == 'success' && (needs.schedule_repair.result == 'success' || (needs.schedule_repair.result == 'skipped' && needs.schedule_route.outputs.repair == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'Clean review admitted without repair'
  schedule_next:
    needs: [schedule_route, schedule_continue]
    if: ${{ !cancelled() && needs.schedule_route.result == 'success' && needs.schedule_continue.result == 'success' }}
    uses: ./.github/workflows/phase2-scheduling-worker.yml
    permissions: {}
  scheduling_proof:
    needs: [schedule_route, schedule_repair, schedule_continue, schedule_next]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require real GitHub scheduling and reusable-job output
        env:
          ROUTE: ${{ needs.schedule_route.result }}
          REPAIR: ${{ needs.schedule_repair.result }}
          CONTINUE: ${{ needs.schedule_continue.result }}
          NEXT: ${{ needs.schedule_next.result }}
          PROOF: ${{ needs.schedule_next.outputs.proof }}
        run: |
          test "$ROUTE" = success
          test "$REPAIR" = skipped
          test "$CONTINUE" = success
          test "$NEXT" = success
          test "$PROOF" = fixture-next-executed
  verify:
    name: synthetic-tests
    needs: scheduling_proof
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail required check if real scheduling proof failed or skipped
        env:
          PROOF_RESULT: ${{ needs.scheduling_proof.result }}
        run: test "$PROOF_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Prepare exact official runtime for no-AI native publication contract
        if: github.event.pull_request.base.sha == 'b876867631bc89c7b5775c98c72f1b44a16c963f' && github.event.pull_request.head.ref == 'codex/phase2-publication-contract' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/pilot-gh-aw-native"
          git init "$native"
          git -C "$native" remote add origin https://github.com/github/gh-aw.git
          git -C "$native" sparse-checkout set actions/setup/js actions/setup/md
          git -C "$native" fetch --depth=1 --filter=blob:none origin 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          git -C "$native" checkout --detach FETCH_HEAD
          test "$(git -C "$native" rev-parse HEAD)" = 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          echo "GH_AW_NATIVE_ACTIONS=$native/actions/setup/js" >> "$GITHUB_ENV"
      - name: Validate exact installation or the scoped functional tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/verify-pilot-ci.py"
          if [ "$BASE_SHA" = b876867631bc89c7b5775c98c72f1b44a16c963f ] && [ "$HEAD_BRANCH" = codex/phase2-publication-contract ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-publication.py" > "$verifier"
          elif [ "$BASE_SHA" = 40ebfd180e4285167d62e9d0ce680b73af5a1116 ] && [ "$HEAD_BRANCH" = codex/phase2-scheduling-v2 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-scheduling.py" > "$verifier"
          elif [ "$BASE_SHA" = fa995cbf91f4e7d02916e35f0fd8f9979a8ad298 ] && [ "$HEAD_BRANCH" = codex/phase2-recovery-v1 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-recovery.py" > "$verifier"
          elif [ "$BASE_SHA" = fe6bf5b4a385da3957b0f5b1678b163510da47cf ] && [ "$HEAD_BRANCH" = codex/phase2-registration-repair ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-registration.py" > "$verifier"
          elif [ "$BASE_SHA" = d5c947f0000a32656eb50a55fca0270e28f6aafa ] && [ "$HEAD_BRANCH" = codex/phase2-issue-3 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-install.py" > "$verifier"
          elif [ "$BASE_SHA" = cdf9d8bb948d36f515e3cb8707e44baab07cd53a ] && [ "$HEAD_BRANCH" = codex/phase3-three-task-pilot ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            git show "$HEAD_SHA:scripts/verify-phase3-install.py" > "$verifier"
          elif [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [[ "$HEAD_BRANCH" == codex/phase3-ascii-vowel-count-v1 || "$HEAD_BRANCH" == codex/phase3-strip-ascii-controls-v1 || "$HEAD_BRANCH" == codex/phase3-collapse-ascii-spaces-v1 ]]; then
            git show "$BASE_SHA:scripts/phase3_worker_ci.py" > "$verifier"
          elif git cat-file -e "$BASE_SHA:scripts/verify-pilot-ci.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          else
            git show "$HEAD_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          fi
          python3 "$verifier"
      - name: Compile the three inert Phase 3 gh-aw sources with pinned official v1.0.1
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v1.0.1
          for id in phase3-coder-1 phase3-coder-2 phase3-coder-3; do
            gh aw compile "$id" --strict
            test -s ".github/workflows/$id.lock.yml"
            echo "PHASE3_COMPILE_PASS $id"
          done
          sha256sum .github/workflows/phase3-coder-*.lock.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: phase3-compiled-workers-review-only
          path: .github/workflows/phase3-coder-*.lock.yml
          if-no-files-found: error
          retention-days: 7
      - name: Install the reviewed compiler output into this Draft PR branch only
        if: github.event.pull_request.base.sha == 'cdf9d8bb948d36f515e3cb8707e44baab07cd53a' && github.event.pull_request.head.ref == 'codex/phase3-three-task-pilot' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'rpickett578'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          gh auth setup-git
          remote_head="$(git ls-remote origin refs/heads/codex/phase3-three-task-pilot | cut -f1)"
          test "$remote_head" = "$PR_HEAD_SHA"
          expected=(phase3-coder-1.lock.yml phase3-coder-2.lock.yml phase3-coder-3.lock.yml)
          for filename in "${expected[@]}"; do
            test -s ".github/workflows/$filename"
          done
          if git cat-file -e "HEAD:.github/workflows/phase3-coder-1.lock.yml" 2>/dev/null; then
            for filename in "${expected[@]}"; do
              git cat-file -e "HEAD:.github/workflows/$filename" || exit 1
              test -z "$(git diff -- ".github/workflows/$filename")"
            done
            echo "PHASE3_LOCKS_ALREADY_INSTALLED"
            exit 0
          fi
          for filename in "${expected[@]}"; do
            if git cat-file -e "HEAD:.github/workflows/$filename" 2>/dev/null; then
              echo "Partial lock installation denied: $filename"
              exit 1
            fi
          done
          git add -- .github/workflows/phase3-coder-1.lock.yml .github/workflows/phase3-coder-2.lock.yml .github/workflows/phase3-coder-3.lock.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compile pinned Phase 3 worker lock files for Draft PR review'
          git push origin HEAD:refs/heads/codex/phase3-three-task-pilot
          echo "PHASE3_LOCKS_COMMITTED_TO_DRAFT_PR"

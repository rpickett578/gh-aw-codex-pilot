name: Synthetic CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    name: synthetic-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Validate exact installation or the scoped functional tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/verify-pilot-ci.py"
          if [ "$BASE_SHA" = fe6bf5b4a385da3957b0f5b1678b163510da47cf ] && [ "$HEAD_BRANCH" = codex/phase2-registration-repair ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-registration.py" > "$verifier"
          elif [ "$BASE_SHA" = d5c947f0000a32656eb50a55fca0270e28f6aafa ] && [ "$HEAD_BRANCH" = codex/phase2-issue-3 ]; then
            git show "$HEAD_SHA:scripts/verify-phase2-install.py" > "$verifier"
          elif git cat-file -e "$BASE_SHA:scripts/verify-pilot-ci.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          else
            git show "$HEAD_SHA:scripts/verify-pilot-ci.py" > "$verifier"
          fi
          python3 "$verifier"

name: Phase 4 generic worker compile-only verification
on:
  pull_request:
    branches: [main, codex/phase4-persistent-queue-foundation]
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  compile:
    if: ${{ github.repository == 'rpickett578/gh-aw-codex-pilot' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/phase4-generic-worker-runtime' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile generic Codex agents without running or paying for them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v1.0.1
          gh aw compile phase4-coder --strict
          gh aw compile phase4-review --strict
          test -s .github/workflows/phase4-coder.lock.yml
          test -s .github/workflows/phase4-review.lock.yml
          sha256sum .github/workflows/phase4-coder.lock.yml .github/workflows/phase4-review.lock.yml
          echo PHASE4_GENERIC_WORKER_COMPILE_ONLY_PASS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase4-generic-compiled-locks-review-only
          path: |
            .github/workflows/phase4-coder.lock.yml
            .github/workflows/phase4-review.lock.yml
          if-no-files-found: error
          retention-days: 7

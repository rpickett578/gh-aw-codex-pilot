name: No-AI scheduling fixture
on:
  workflow_call:
    outputs:
      proof:
        value: ${{ jobs.prove_next.outputs.proof }}
permissions: {}
jobs:
  prove_next:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      proof: ${{ steps.proof.outputs.proof }}
    steps:
      - id: proof
        name: Prove GitHub executed the reusable next job
        run: echo 'proof=fixture-next-executed' >> "$GITHUB_OUTPUT"
